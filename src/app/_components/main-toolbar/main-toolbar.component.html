<ion-toolbar [color]="isOnline ? 'primary' : 'danger'">
  <ion-buttons [collapse]="true" slot="start">
    <ion-back-button ></ion-back-button>
    <ion-button *ngIf="showInfo && offlineReady && isOnline" [routerLink]="['/page','offline']"  routerDirection="root" aria-label="Tryb offline aktywny">
      <ion-icon slot="icon-only" name="radio-outline" aria-hidden="true" ></ion-icon>
    </ion-button> 
  </ion-buttons>

  <ion-title *ngIf="isOnline && !isNewVesrion">
    <mapy73pl-logo class="action" [routerLink]="['/']" routerDirection="root" ></mapy73pl-logo> 
    <span *ngIf="showInfo && isDekstop" >
      @if (repCount > 1 ) {
        i <strong>{{repCount}}</strong> przemienniki krótkofalarskie
      } @else {
        @if (repCount === 1 ) {
          i przemiennik krótkofalarski
        } @else {
          i przemienniki krótkofalarskie
        }
      }

    </span>
  </ion-title>   
  <ion-title *ngIf="!isOnline">
    <span class="action" [routerLink]="['/']" routerDirection="root">Offline Mapy73pl</span>
  </ion-title>   


  <ion-buttons [collapse]="true" slot="end">
    <!-- <ion-spinner  *ngIf="loading" name="circular" color="secondary"></ion-spinner> -->


    <ng-content *ngIf="isNewVesrion">
      Nowa wersja!
      <ion-button (click)="refreshPage()" fill="outline" size="small" color="light"> Odśwież stronę</ion-button>       
    </ng-content>

    <ng-content *ngIf="savedPathCount">
      <ion-button [routerLink]="['/export']" routerDirection="root" aria-label="Export przemiennikow">
        <ion-icon slot="icon-only"  name="cloud-download-outline" aria-hidden="true" ></ion-icon>
      </ion-button>      
      <ion-badge [routerLink]="['/export']" routerDirection="root"  class="m73-no-action" color="success">{{savedPathCount}}</ion-badge>
    </ng-content>

  

    <ion-button [routerLink]="['/page','site-map']" routerDirection="root" aria-label="informacje" >
      <ion-icon slot="icon-only" name="information-circle-outline" aria-hidden="true"></ion-icon>
    </ion-button>
  </ion-buttons>
</ion-toolbar>
