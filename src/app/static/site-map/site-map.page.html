<ion-header [translucent]="true">
  <mapy73pl-main-toolbar></mapy73pl-main-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">

  <h1>{{siteName}}</h1>
  <ion-list >
    <ion-item [button]="true" [routerLink]="['/']" [routerDirection]="'root'">
      <ion-icon aria-hidden="true" color="secondary" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Mapa przemienników</ion-label>
    </ion-item>
    <ion-item [button]="true" [routerLink]="['/page','news']" >
      <ion-icon aria-hidden="true" color="danger" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Aktualności</ion-label>
    </ion-item>    
    <!-- <ion-item [button]="true">
      <ion-icon color="tertiary" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Shopping</ion-label>
    </ion-item> -->
    <ion-item [button]="true" [routerLink]="['/page','privacy-policy']" >
      <ion-icon aria-hidden="true" color="success" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Polityka prywatności</ion-label>
    </ion-item>
    <ion-item [button]="true" [routerLink]="['/page','cookie-info']">
      <ion-icon aria-hidden="true" color="warning" slot="start" name="list-circle" size="large"></ion-icon>
      <ion-label>Mechanizmy cookies w serwisie</ion-label>
    </ion-item>
  </ion-list>

  <ion-grid [fixed]="true" >
    <ion-row class="ion-align-items-start">
      <ion-col size="auto">
        <ion-card  style="width: 220px">
          <ion-card-header>
            <ion-card-title>Baza danych z dnia</ion-card-title>
            <ion-card-subtitle>2025-06-02</ion-card-subtitle>
          </ion-card-header>
        </ion-card>
      </ion-col>     
    </ion-row>
  </ion-grid>
</ion-content>
